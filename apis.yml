name: BlueTarp Financial
description: 'BlueTarp Financial is a B2B trade-credit and accounts-receivable financing company, founded
  in Portland, Maine, that lets suppliers, distributors, and building-materials dealers extend revolving
  or net-terms credit to their business customers while BlueTarp pays the supplier upfront and assumes the
  credit risk and collections. Its SmartView portal manages the purchase-to-payment lifecycle: credit
  decisioning, invoicing, billing, and receivables. BlueTarp was acquired and is now operated as Capital
  One Trade Credit; its independent site (bluetarp.com) redirects to capitalone.com/trade-credit/bluetarp.
  BlueTarp publishes no public developer portal, API documentation, or SDKs. This API Evangelist profile
  was surfaced as a portfolio company of Trinity Ventures.'
